name: Release & Auto-Update Bundles

on:
  push:
    tags:
      - 'v*'

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles msi'
          - platform: 'macos-latest'
            args: '--bundles dmg,app'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install client dependencies
        run: |
          cd client
          npm ci

      - name: Build Tauri Desktop Bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          cd client
          npx tauri build ${{ matrix.args }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundle-${{ matrix.platform }}
          path: client/src-tauri/target/release/bundle/

  publish-release:
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate updater manifest
        run: |
          node scripts/generate_updater_manifest.mjs

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            latest.json
            tauri-bundle-windows-latest/msi/*
            tauri-bundle-macos-latest/dmg/*
            tauri-bundle-macos-latest/macos/*
          draft: false
          prerelease: false
