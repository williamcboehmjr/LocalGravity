name: Cross-Platform Release Builders

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build installers for (e.g. v2.3.12)'
        required: true
        type: string

jobs:
  build-macos-universal:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Rust stable (Apple Silicon + Intel)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install client dependencies
        run: |
          cd client
          npm ci

      - name: Build macOS Universal DMG & Updater Bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          cd client
          npx tauri build --bundles dmg,app --target universal-apple-darwin

      - name: Upload macOS Universal Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          FILES=(
            client/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            client/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            client/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          )
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No macOS bundle artifacts found"
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" "${FILES[@]}" --clobber

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux ARM64 Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            libfuse2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install client dependencies
        run: |
          cd client
          npm ci

      - name: Build Linux ARM64 Bundles (DEB, RPM, Portable Tarball)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          cd client
          npx tauri build --bundles deb,rpm
          npx tauri build --bundles appimage || true
          VER="${RELEASE_TAG#v}"
          if [ -f "src-tauri/target/release/localgravity-edge" ]; then
            tar -czf "src-tauri/target/release/bundle/LocalGravity_${VER}_linux_arm64.tar.gz" -C "src-tauri/target/release" localgravity-edge
          fi

      - name: Upload Linux ARM64 Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          FILES=(
            client/src-tauri/target/release/bundle/deb/*.deb
            client/src-tauri/target/release/bundle/rpm/*.rpm
            client/src-tauri/target/release/bundle/appimage/*.AppImage
            client/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            client/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            client/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig
            client/src-tauri/target/release/bundle/LocalGravity_*_linux_arm64.tar.gz
          )
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No Linux ARM64 bundle artifacts found"
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" "${FILES[@]}" --clobber

  build-windows-arm64:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-11-arm
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Rust stable (Windows ARM64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Install client dependencies
        run: |
          cd client
          npm ci

      - name: Build Native Windows ARM64 MSI
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          cd client
          npx tauri build --bundles msi --target aarch64-pc-windows-msvc

      - name: Upload Windows ARM64 Artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @(
            Get-ChildItem -Path "client/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
            Get-ChildItem -Path "client/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi.sig" -ErrorAction SilentlyContinue
          ) | ForEach-Object { $_.FullName }
          if ($files.Count -eq 0) {
            Write-Error "No Windows ARM64 MSI artifacts found"
            exit 1
          }
          gh release upload $env:RELEASE_TAG @files --clobber

  finalize-manifest:
    runs-on: ubuntu-latest
    needs: [build-macos-universal, build-linux-arm64]
    if: always()
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Assemble Final Multi-OS latest.json
        run: |
          mkdir -p /tmp/release-sigs
          gh release view "${RELEASE_TAG}" --json assets,body,publishedAt > /tmp/release-meta.json
          gh release download "${RELEASE_TAG}" --pattern "*.sig" --dir /tmp/release-sigs --clobber || true

          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const tag = process.env.RELEASE_TAG;
          const ver = tag.replace(/^v/, '');
          const repo = process.env.GITHUB_REPOSITORY || 'williamcboehmjr/LocalGravity';
          const meta = JSON.parse(fs.readFileSync('/tmp/release-meta.json', 'utf8'));
          const assets = Array.isArray(meta.assets) ? meta.assets : [];
          const assetNames = new Set(assets.map((a) => a.name));

          const readSig = (name) => {
            const p = path.join('/tmp/release-sigs', name);
            return fs.existsSync(p) ? fs.readFileSync(p, 'utf8').trim() : '';
          };
          const dlUrl = (name) => `https://github.com/${repo}/releases/download/${tag}/${name}`;

          const platforms = {};

          // Windows x64
          const winX64 = `LocalGravity_${ver}_x64_en-US.msi`;
          const winX64Sig = readSig(`${winX64}.sig`);
          if (assetNames.has(winX64) && winX64Sig) {
            platforms['windows-x86_64'] = { signature: winX64Sig, url: dlUrl(winX64) };
          }

          // Windows ARM64
          const winArm64 = `LocalGravity_${ver}_arm64_en-US.msi`;
          const winArm64Sig = readSig(`${winArm64}.sig`);
          if (assetNames.has(winArm64) && winArm64Sig) {
            platforms['windows-aarch64'] = { signature: winArm64Sig, url: dlUrl(winArm64) };
          }

          // macOS Universal (.app.tar.gz + .app.tar.gz.sig)
          const macTar = 'LocalGravity.app.tar.gz';
          const macTarSig = readSig('LocalGravity.app.tar.gz.sig');
          if (assetNames.has(macTar) && macTarSig) {
            platforms['darwin-aarch64'] = { signature: macTarSig, url: dlUrl(macTar) };
            platforms['darwin-x86_64'] = { signature: macTarSig, url: dlUrl(macTar) };
          }

          // Linux x64 (.AppImage + .AppImage.sig)
          const linuxX64App = `LocalGravity_${ver}_amd64.AppImage`;
          const linuxX64Sig = readSig(`${linuxX64App}.sig`);
          if (assetNames.has(linuxX64App) && linuxX64Sig) {
            platforms['linux-x86_64'] = { signature: linuxX64Sig, url: dlUrl(linuxX64App) };
          }

          // Linux ARM64 (prefer signed AppImage, else .deb fallback)
          const linuxArmApp = `LocalGravity_${ver}_aarch64.AppImage`;
          const linuxArmSig = readSig(`${linuxArmApp}.sig`) || readSig(`${linuxArmApp}.tar.gz.sig`);
          const linuxArmDeb = `LocalGravity_${ver}_arm64.deb`;
          if (assetNames.has(linuxArmApp) && linuxArmSig) {
            platforms['linux-aarch64'] = { signature: linuxArmSig, url: dlUrl(linuxArmApp) };
          } else if (assetNames.has(`${linuxArmApp}.tar.gz`) && linuxArmSig) {
            platforms['linux-aarch64'] = { signature: linuxArmSig, url: dlUrl(`${linuxArmApp}.tar.gz`) };
          } else if (assetNames.has(linuxArmDeb)) {
            platforms['linux-aarch64'] = { signature: '', url: dlUrl(linuxArmDeb) };
          }

          // Android ARM64 (.apk)
          const androidApk = `LocalGravity_${ver}_arm64.apk`;
          if (assetNames.has(androidApk)) {
            platforms['android-aarch64'] = { signature: '', url: dlUrl(androidApk) };
          }

          const manifest = {
            version: tag,
            notes: meta.body || `LocalGravity ${tag} Release`,
            pub_date: meta.publishedAt || new Date().toISOString(),
            platforms,
          };

          fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2) + '\n', 'utf8');
          console.log('Generated finalized latest.json for platforms:', Object.keys(platforms).join(', '));
          EOF

          gh release upload "${RELEASE_TAG}" latest.json --clobber
