[project]
name = "localgravity-brain"
version = "0.1.0"
description = "Central Brain for LocalGravity - Local-first LocalGravity Clone"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "psutil>=6.0.0",
    "nvidia-ml-py>=12.535.133",
    "pyyaml>=6.0.1",
    "watchdog>=4.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
