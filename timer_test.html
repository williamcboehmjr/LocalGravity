<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body{background:#0b0d12;font-family:ui-monospace,monospace;padding:40px;color:#e5e7eb}
  .badge{display:flex;align-items:center;gap:12px;border-radius:10px;border-width:1px;border-style:solid;padding:8px 12px;box-shadow:0 6px 16px rgba(0,0,0,.5);width:max-content;margin-bottom:24px}
  .amber{border-color:#f59e0b66;background:#1a1714f2}
  .sky{border-color:#38bdf866;background:#14233af2}
  .ring-wrap{position:relative;width:56px;height:56px;flex-shrink:0}
  svg{-rotate:-90deg;transform:rotate(-90deg)}
  .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold}
  .amber .num{color:#fde68a}.sky .num{color:#bae6fd}
  .title{font-size:12px;font-weight:600;margin-bottom:2px}
  .amber .title{color:#fef3c7}.sky .title{color:#e0f2fe}
  .attempt{font-size:11px;color:#9ca3af}
  .pulse{width:8px;height:8px;border-radius:50%;animation:ping 1s infinite;flex-shrink:0}
  .amber .pulse{background:#fbbf24}.sky .pulse{background:#7dd3fc}
  @keyframes ping{0%{opacity:.9}50%{opacity:.3}100%{opacity:.9}}
</style></head>
<body>
<div id="recon" class="badge amber">
  <div class="ring-wrap"><svg width=56 height=56 viewBox="0 0 56 56">
    <circle cx=28 cy=28 r=26 fill=none stroke=#3a2d1c stroke-width=4/>
    <circle id="arcR" cx=28 cy=28 r=26 fill=none stroke=#f59e0b stroke-width=4 stroke-linecap=round stroke-dasharray="163.36" stroke-dashoffset=0 style="transition:stroke-dashoffset 1s linear"/>
  </svg><div class="num"><span id="numR">3</span></div></div>
  <div><div class="title">Reconnecting</div><div class="attempt">Attempt #2</div></div>
  <span class="pulse"></span>
</div>

<div id="dl" class="badge sky">
  <div class="ring-wrap"><svg width=56 height=56 viewBox="0 0 56 56">
    <circle cx=28 cy=28 r=26 fill=none stroke=#1c2d3a stroke-width=4/>
    <circle id="arcD" cx=28 cy=28 r=26 fill=none stroke=#38bdf8 stroke-width=4 stroke-linecap=round stroke-dasharray="163.36" style="transition:stroke-dashoffset 1s linear"/>
  </svg><div class="num"><span id="numD">15</span></div></div>
  <div><div class="title">Downloading model</div><div class="attempt">E:/Models · Qwen3.8</div></div>
  <span class="pulse"></span>
</div>

<script>
const C=2*Math.PI*26; // circumference
function setArc(id,rem,total){document.getElementById(id).setAttribute('stroke-dashoffset',C*(1-rem/total));}
// reconnect: 3->0 over ~3s
let rR=3,dD=15;
setInterval(()=>{ if(rR>0){rR--;document.getElementById('numR').textContent=rR>0?rR:'··';setArc('arcR',rR,3);} },1000);
setInterval(()=>{ if(dD>0){dD--;document.getElementById('numD').textContent=dD; setArc('arcD',dD,15);} },1000);
</script>
</body></html>
